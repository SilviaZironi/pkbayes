[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pkbayes"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "pymc>=6", "arviz>=1", "xarray", "h5netcdf", "SALib"]

[tool.setuptools.packages.find]
where = ["src"]
